<html lang="de"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neues Design</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #ffffff;
      --panel-bg: #4f46e5;
      --ink: #111111;
      --muted: #6f6f6f;
      --stave: #111111;
      --svg-stave: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%20192%22%20preserveAspectRatio%3D%22none%20slice%22%3E%3Cline%20x1%3D%220%22%20y1%3D%2248%22%20x2%3D%2224%22%20y2%3D%2248%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%2272%22%20x2%3D%2224%22%20y2%3D%2272%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%2296%22%20x2%3D%2224%22%20y2%3D%2296%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%22120%22%20x2%3D%2224%22%20y2%3D%22120%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%22144%22%20x2%3D%2224%22%20y2%3D%22144%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3C/svg%3E");
      --svg-stave-header: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Cline%20x1%3D%220%22%20y1%3D%2248%22%20x2%3D%22192%22%20y2%3D%2248%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%2272%22%20x2%3D%22192%22%20y2%3D%2272%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%2296%22%20x2%3D%22192%22%20y2%3D%2296%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%22120%22%20x2%3D%22192%22%20y2%3D%22120%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%22144%22%20x2%3D%22192%22%20y2%3D%22144%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3C/svg%3E");
      --svg-bar-line: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2012%2098%22%3E%3Cline%20x1%3D%2211%22%20y1%3D%220%22%20x2%3D%2211%22%20y2%3D%2298%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22/%3E%3C/svg%3E");
      --svg-quarter-up: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2034%20192%22%3E%3Cpath%20d%3D%22M31.16%2C87.72c2.73%2C4.8-1.39%2C12.39-9.21%2C17s-16.37%2C4.4-19.1-.4%2C1.39-12.39%2C9.21-17S28.42%2C82.92%2C31.16%2C87.72Z%22/%3E%3Crect%20x%3D%22-2.5%22%20y%3D%2256.5%22%20width%3D%2267%22%20height%3D%222%22%20transform%3D%22translate(88.5%2026.5)%20rotate(90)%22/%3E%3C/svg%3E");
      --svg-quarter-down: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2034%20192%22%3E%3Cpath%20d%3D%22M2.84%2C104.28c-2.73-4.8%2C1.39-12.39%2C9.21-17s16.37-4.4%2C19.1.4-1.39%2C12.39-9.21%2C17S5.58%2C109.08%2C2.84%2C104.28Z%22/%3E%3Crect%20x%3D%22-30.5%22%20y%3D%22133.5%22%20width%3D%2267%22%20height%3D%222%22%20transform%3D%22translate(-131.5%20137.5)%20rotate(-90)%22/%3E%3C/svg%3E");
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--page-bg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      overflow: hidden;
      --ui-scale: 1.1;
    }

    body[data-state="0"] {
      --panel-bg: #3300ff;
      --star-fill: #87ceeb;
      --star-rotation: 0deg;
    }

    body[data-state="1"] {
      --panel-bg: #ff00f5;
      --star-fill: #ffb2ef;
      --star-rotation: 120deg;
    }

    body[data-state="2"] {
      --panel-bg: #ff4911;
      --star-fill: #ffa07a;
      --star-rotation: 240deg;
    }

    body.is-admin {
      --panel-bg: #d8d8d8;
      --star-fill: #efefef;
      --star-rotation: 360deg;
    }

    .screen {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: calc(100vw / var(--ui-scale));
      height: calc(100vh / var(--ui-scale));
      transform: scale(var(--ui-scale));
      transform-origin: top left;
      touch-action: none;
      user-select: none;
    }

    .admin-hint {
      position: absolute;
      top: 1.1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      color: #111111;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      z-index: 20;
      pointer-events: none;
      width: fit-content;
      max-width: min(24rem, calc(100vw - 2rem));
      text-align: center;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: none;
      transition: opacity 180ms ease, transform 180ms ease;
      white-space: normal;
    }

    .admin-hint svg {
      width: 1.05rem;
      height: 1.05rem;
      display: block;
      stroke-width: 2.25;
    }

    .admin-hint.is-returning {
      width: fit-content;
    }

    .admin-hint.is-returning .admin-hint-icon svg {
      width: 1.1rem;
      height: 1.1rem;
    }

    body.is-admin .admin-hint {
      top: auto;
      bottom: 1.1rem;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      padding: 0.2rem 0.7rem;
    }

    .left-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5.5vw;
      position: relative;
    }

    .left-stack {
      width: min(572px, 100%);
      position: relative;
      display: block;
    }

    .panel {
      width: 100%;
      height: 748px;
      background: var(--panel-bg);
      border-radius: 28px;
      border: 3px solid var(--ink);
      box-shadow: none;
      transition: background-color 220ms ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 44px;
      position: relative;
      gap: 28px;
      overflow: hidden;
      isolation: isolate;
      z-index: 1;
    }

    .left-stack.is-expanded .panel {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    body.is-admin .panel {
      background: #d8d8d8;
    }

    .panel-fluid {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.08) translate(16%, 16%);
      transform-origin: 100% 100%;
      transition: transform 760ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms ease;
      z-index: 1;
      pointer-events: none;
    }

    .panel-fluid svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .panel-fluid path,
    .panel-fluid circle {
      fill: #ffffff;
    }

    .panel.is-fluid-active .panel-fluid {
      opacity: 1;
      transform: scale(1) translate(0, 0);
    }

    .panel:not(.is-fluid-active) .panel-fluid {
      opacity: 0;
    }

    .panel-expander {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      overflow: hidden;
      z-index: 4;
      pointer-events: none;
    }

    body.is-admin .panel-expander {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    .panel-expander-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      background: #ffffff;
      border: 0;
      border-top: 3px solid var(--ink);
      border-radius: 0;
      box-sizing: border-box;
      transform: scaleY(0);
      transform-origin: bottom center;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      pointer-events: auto;
      z-index: 5;
    }

    .left-stack.is-expanded .panel-expander-panel {
      transform: scaleY(1);
    }

    .panel-expander-icons {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      align-items: center;
      justify-items: center;
    }

    .panel-expander-icon {
      display: grid;
      place-items: center;
      align-self: center;
      color: #111111;
    }

    .panel-expander-icon.is-action {
      cursor: pointer;
      transition: transform 180ms ease, color 180ms ease;
    }

    .panel-expander-icon.is-action.is-active {
      color: var(--panel-bg);
    }

    .panel-expander-icon.is-action:active {
      transform: scale(0.94);
    }

    .panel-expander-icon svg {
      width: 1.9rem;
      height: 1.9rem;
      display: block;
      stroke-width: 2.25;
    }

    .panel-star {
      position: absolute;
      top: -3.35rem;
      right: -3.35rem;
      width: 8rem;
      height: 8rem;
      z-index: 10;
      pointer-events: none;
    }

    .left-stack .panel-star {
      z-index: 10;
    }

    .panel-corner-button {
      z-index: 10;
    }

    .panel-star-time {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #111111;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      z-index: 11;
      mix-blend-mode: normal;
      text-shadow: 0 0 0 #111111;
    }

    .panel-star-admin {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.78);
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 11;
      pointer-events: none;
    }

    .panel-star-admin svg {
      width: 1.35rem;
      height: 1.35rem;
      display: block;
      stroke-width: 2.25;
    }

    .panel-star svg {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 0;
      transform: rotate(var(--star-rotation));
      transform-origin: center;
      transition: transform 260ms ease;
    }

    .panel-star path {
      fill: var(--star-fill);
      stroke: #111111;
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    body.is-admin .panel-star-time {
      opacity: 0;
      transform: scale(0.85);
    }

    body.is-admin .panel-star-admin {
      opacity: 1;
      transform: scale(1);
    }

    .panel-corner-button {
      position: absolute;
      right: -0.15rem;
      bottom: -0.15rem;
      width: 2.65rem;
      height: 2.65rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      color: #ffffff;
      cursor: pointer;
      background: transparent;
      transition: transform 220ms ease, right 320ms cubic-bezier(0.22, 1, 0.36, 1), bottom 320ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 20;
    }

    .left-stack.is-expanded .panel-corner-button {
      right: 1.15rem;
      bottom: 7.1rem;
    }

    body.is-admin .panel-corner-button {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
    }

    .panel-corner-button:active {
      transform: scale(0.96);
    }

    .panel-corner-icon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transition: opacity 180ms ease, transform 220ms ease;
    }

    .panel-corner-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke-width: 2.25;
    }

    .panel-corner-icon-down {
      opacity: 0;
      transform: scale(0.88);
    }

    .panel-corner-button.is-active .panel-corner-icon-up {
      opacity: 0;
      transform: scale(0.88);
    }

    .panel-corner-button.is-active .panel-corner-icon-down {
      opacity: 1;
      transform: scale(1);
    }

    .panel h1 {
      margin: 0;
      font-size: clamp(2.25rem, 3.35vw, 3.35rem);
      line-height: 1.05;
      color: #ffffff;
      letter-spacing: -0.04em;
      font-weight: 700;
      text-align: center;
      transition: opacity 180ms ease, transform 180ms ease;
      will-change: opacity, transform;
      position: relative;
      z-index: 2;
    }

    .panel h1.is-exiting {
      opacity: 0;
      transform: translateX(-18px);
    }

    .panel h1.is-entering {
      opacity: 0;
      transform: translateX(18px);
    }

    body.is-admin .panel h1 {
      color: #111111;
    }

    body.is-auth-view {
      background: #ffffff;
    }

    body.is-auth-view .admin-hint,
    body.is-auth-view .panel-star,
    body.is-auth-view .panel-expander,
    body.is-auth-view .panel-corner-button {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    body.is-auth-view .panel {
      background: #111111;
      border-color: #111111;
    }

    body.is-auth-view .panel h1,
    body.is-auth-view .panel-fluid {
      opacity: 0;
      pointer-events: none;
    }

    body.is-auth-view .right-side {
      display: none;
    }

    .right-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5.5vw;
      position: relative;
    }

    .notation {
      width: min(616px, 100%);
      min-height: 748px;
      background: transparent;
      border-radius: 28px;
      border: none;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
      transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1), opacity 260ms ease;
      will-change: transform, opacity;
    }

    body.is-auth-view .notation {
      opacity: 0;
      transform: translateY(24px);
      pointer-events: none;
    }

    .auth-stage {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 6;
    }

    body.is-auth-view .auth-stage {
      display: flex;
    }

    .auth-card {
      width: min(440px, calc(100% - 48px));
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      transform: none;
      box-shadow: none;
    }

    .auth-card-inner {
      width: min(420px, 100%);
      display: grid;
      gap: 18px;
    }

    .auth-title {
      margin: 0;
      color: #ffffff;
      font-size: clamp(2.35rem, 4.35vw, 3.3rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .auth-meta {
      display: none;
    }

    .auth-inline-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
    }

    .auth-input {
      width: 100%;
      border: 0;
      border-bottom: 3px solid #ffffff;
      border-radius: 0;
      padding: 0.9rem 0 0.65rem;
      background: transparent;
      color: #ffffff;
      font: inherit;
      font-size: clamp(1.2rem, 2.1vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      outline: none;
      box-shadow: none;
      appearance: none;
    }

    .auth-input::placeholder {
      color: rgba(255, 255, 255, 0.78);
    }

    .auth-status {
      min-height: 1.2rem;
      margin: 0;
      color: #ffffff;
      font-size: 0.92rem;
      line-height: 1.3;
    }

    .auth-step-button {
      width: 3.1rem;
      height: 3.1rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #ffffff;
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .auth-step-button svg {
      width: 1.55rem;
      height: 1.55rem;
      display: block;
      stroke-width: 2.6;
    }

    .auth-step-button:active {
      transform: scale(0.94);
    }

    .auth-step-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .auth-status {
      min-height: 1.3rem;
      margin: 0;
      font-size: 0.94rem;
      line-height: 1.3;
      color: #6f6f6f;
    }

    .auth-status[data-state="error"] {
      color: #d62424;
    }

    .auth-status[data-state="success"] {
      color: #118a43;
    }

    body.is-admin .notation {
      transform: translateY(140vh);
      opacity: 0;
    }

    .admin-calendar {
      position: absolute;
      inset: 5vw;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity 260ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 2;
    }

    body.is-admin .admin-calendar {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .admin-calendar-shell {
      width: min(748px, 100%);
      height: min(748px, 100%);
      background: #ffffff;
      border: 3px solid var(--ink);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(-2.25vw);
    }

    .admin-calendar-header {
      padding: 30px 28px 20px;
      border-bottom: 3px solid var(--ink);
      background: linear-gradient(180deg, #ffffff 0%, #f6f6f6 100%);
    }

    .admin-calendar-title {
      margin: 0;
      font-size: clamp(2rem, 2.8vw, 2.8rem);
      line-height: 1;
      color: #111111;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .admin-calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      border-bottom: 3px solid var(--ink);
    }

    .admin-calendar-weekday {
      padding: 14px 10px;
      text-align: center;
      font-size: 0.82rem;
      color: #111111;
      background: #ffffff;
      border-right: 3px solid var(--ink);
      font-weight: 700;
    }

    .admin-calendar-weekday:last-child {
      border-right: 0;
    }

    .admin-calendar-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(58px, 1fr);
      background: #ffffff;
    }

    .admin-calendar-stage {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    .admin-calendar-stage.is-detail-above {
      flex-direction: column-reverse;
    }

    .admin-calendar-stage.is-detail-below {
      flex-direction: column;
    }

    .admin-calendar-cell {
      position: relative;
      padding: 12px;
      border-right: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      min-height: 0;
      background: #ffffff;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      font-size: 0.95rem;
      font-weight: 700;
      color: #111111;
    }

    .admin-calendar-cell:nth-child(7n) {
      border-right: 0;
    }

    .admin-calendar-cell.is-empty {
      background: #fbfbfb;
      color: transparent;
    }

    .admin-calendar-cell.is-today {
      background: #efefef;
    }

    .admin-calendar-day {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      line-height: 1;
    }

    .admin-calendar-pill {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      border: 3px solid var(--ink);
      background: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .admin-calendar-cell.is-selected {
      background: #f3f3f3;
    }

    .admin-calendar-cell.has-event .admin-calendar-day::after {
      content: "";
      position: absolute;
      left: 100%;
      top: 50%;
      width: 0.45rem;

      authFlowInput.type = authStep === "password" ? "password" : "email";
      authFlowInput.inputMode = authStep === "password" ? "text" : "email";
      authFlowInput.placeholder = authStep === "password" ? "Passwort" : "E-Mail Adresse";
      authFlowInput.autocomplete = authStep === "password" ? "current-password" : "email";
      authStepButton.setAttribute("aria-label", authStep === "password" ? "Einloggen" : "Weiter");
    }

    function shouldIgnoreSwipeTarget(target) {

    function formatCalendarDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatCalendarDateLabel(date) {
      return new Intl.DateTimeFormat("de-DE", {
        weekday: "short",
        day: "2-digit",
        month: "long"
      }).format(date);

    function renderCalendarEvents(cell, dateKey) {
      cell.querySelectorAll(".admin-calendar-event").forEach((eventElement) => eventElement.remove());

    function closeCalendarDetail() {

      adminCalendarDetail.classList.remove("is-open", "is-above", "is-below");

    function closeAdminTools() {
      adminTools.classList.remove("is-expanded");

      adminToolsButton.setAttribute("aria-pressed", "false");

    function resetSwipeState() {
      pointerId = null;
      startX = null;
      startY = null;
      touchIdentifier = null;
      touchStartX = null;
      touchStartY = null;
    }

    function buildAdminCalendar(referenceDate = new Date()) {
      const year = referenceDate.getFullYear();
      const month = referenceDate.getMonth();
      const today = new Date();
      adminCalendarTitle.textContent = new Intl.DateTimeFormat("de-DE", {
        month: "long",
        year: "numeric"
      }).format(new Date(year, month, 1));
      adminCalendarGrid.innerHTML = "";
      closeCalendarDetail();

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const totalCells = Math.ceil((firstDayIndex + daysInMonth) / 7) * 7;
      const totalRows = totalCells / 7;
      adminCalendarGrid.dataset.rows = String(totalRows);

      for (let cellIndex = 0; cellIndex < totalCells; cellIndex += 1) {
        const dayNumber = cellIndex - firstDayIndex + 1;
        const cell = document.createElement("div");
        cell.className = "admin-calendar-cell";
        cell.dataset.row = String(Math.floor(cellIndex / 7));
        cell.dataset.column = String(cellIndex % 7);

        if (dayNumber < 1 || dayNumber > daysInMonth) {
          cell.classList.add("is-empty");
          cell.setAttribute("aria-hidden", "true");
          adminCalendarGrid.appendChild(cell);
          continue;
        }

        const currentDate = new Date(year, month, dayNumber);
        const dateKey = formatCalendarDateKey(currentDate);
        cell.dataset.year = String(year);
        cell.dataset.month = String(month);
        cell.dataset.day = String(dayNumber);
        cell.dataset.dateKey = dateKey;

        const dayElement = document.createElement("span");
        dayElement.className = "admin-calendar-day";
        dayElement.textContent = String(dayNumber);
        cell.appendChild(dayElement);

        if (
          today.getFullYear() === year &&
          today.getMonth() === month &&
          today.getDate() === dayNumber
        ) {
          cell.classList.add("is-today");
          const pill = document.createElement("span");
          pill.className = "admin-calendar-pill";
          pill.textContent = "Heute";
          cell.appendChild(pill);
        }

        renderCalendarEvents(cell, dateKey);
        adminCalendarGrid.appendChild(cell);
      }
    }

    function parseNoteName(name) {
      const match = String(name || "").match(/^([A-G])(#?)(\d)$/);
      if (!match) {
        throw new Error(`Ungueltiger Notenname: ${name}`);
      }
      const [, letter, accidental, octaveText] = match;
      return { letter, accidental, octave: Number(octaveText) };
    }

    function midiNumberToName(midi) {
      const semitone = semitoneNames[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${semitone}${octave}`;
    }

    function displayNoteName(name) {
      return String(name || "").startsWith("B")
        ? `H${String(name).slice(1)}`
        : String(name || "");
    }

    function diatonicValue(name) {
      const { letter, octave } = parseNoteName(name);
      return octave * 7 + noteLetters.indexOf(letter);
    }

    function semitoneValue(name) {
      const midiMap = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const { letter, accidental, octave } = parseNoteName(name);
      return (octave + 1) * 12 + midiMap[letter] + (accidental === "#" ? 1 : 0);
    }

    function isBlackKey(midi) {
      return midiNumberToName(midi).includes("#");
    }

    function deriveClefForNote(noteName) {
      return semitoneValue(noteName) < semitoneValue("C4") ? "bass" : "treble";
    }

    function buildRange(start, end, forcedClef = null) {
      const notes = [];
      for (let midi = semitoneValue(start); midi <= semitoneValue(end); midi += 1) {
        if (isBlackKey(midi)) {
          continue;
        }
        const name = midiNumberToName(midi);
        const clef = forcedClef || deriveClefForNote(name);
        notes.push({
          name,
          midi,
          clef,
          step: diatonicValue(name) - diatonicValue(clefConfigs[clef].reference)
        });
      }
      return notes;
    }

    function srsRangeOptionsForMode(mode) {
      const config = clefConfigs[mode];
      return config ? buildRange(config.range[0], config.range[1], mode) : [];
    }

    function notesInRange(mode, range) {
      const allNotes = srsRangeOptionsForMode(mode).map((entry) => entry.name);
      const startIndex = allNotes.indexOf(range[0]);
      const endIndex = allNotes.indexOf(range[1]);
      if (startIndex === -1 || endIndex === -1) {
        return [];
      }
      return allNotes.slice(startIndex, endIndex + 1);
    }

    function mergedRange(leftRange, rightRange, mode) {
      const notes = srsRangeOptionsForMode(mode).map((entry) => entry.name);
      const indexes = [
        notes.indexOf(leftRange[0]),
        notes.indexOf(leftRange[1]),
        notes.indexOf(rightRange[0]),
        notes.indexOf(rightRange[1])
      ].filter((value) => value >= 0);
      if (!indexes.length) {
        return rightRange;
      }
      return [notes[Math.min(...indexes)], notes[Math.max(...indexes)]];
    }

    function srsRangeFromState(mode, state) {
      const ranges = levelRangesByMode[mode] || [];
      const levelIndex = Math.max(0, Math.min(ranges.length - 1, (state?.level || 1) - 1));
      return ranges[levelIndex] || clefConfigs[mode].range;
    }

    function srsTrainingRangeFromState(mode, state) {
      const focusRange = srsRangeFromState(mode, state);
      const previousLevel = Math.max(1, (state?.level || 1) - 1);
      if (previousLevel === (state?.level || 1)) {
        return focusRange;
      }
      const previousRange = srsRangeFromState(mode, { ...state, level: previousLevel });
      return mergedRange(previousRange, focusRange, mode);
    }

    function noteStatFor(mode, noteName) {
      return noteStats[mode]?.[noteName] || null;
    }

    function noteAccuracy(stat) {
      const attempts = Number(stat?.attempts || 0);
      return attempts ? Number(stat.correct || 0) / attempts : 0;
    }

    function noteAverageResponseMs(stat) {
      const attempts = Number(stat?.attempts || 0);
      return attempts ? Number(stat.total_ms || 0) / attempts : null;
    }

    function daysSinceIso(isoText) {
      if (!isoText) {
        return 0;
      }
      const timestamp = new Date(isoText).getTime();
      if (!Number.isFinite(timestamp)) {
        return 0;
      }
      return Math.max(0, (Date.now() - timestamp) / (24 * 60 * 60 * 1000));
    }

    function noteRetentionFactor(stat) {
      if (!stat?.last_seen_at) {
        return 1;
      }
      const daysSinceSeen = daysSinceIso(stat.last_seen_at);
      const attempts = Number(stat.attempts || 0);
      const accuracy = noteAccuracy(stat);
      const streak = Number(stat.streak || 0);
      const graceDays =
        0.85 +
        Math.min(4.5, attempts / 4) +
        Math.max(0, (accuracy - 0.6) * 3.2) +
        Math.min(2.2, streak / 2.2);

      if (daysSinceSeen <= graceDays) {
        return 1;
      }

      const overdueDays = daysSinceSeen - graceDays;
      const dailyDecay = accuracy >= 0.88 ? 0.08 : accuracy >= 0.75 ? 0.12 : 0.18;
      return Math.max(0.42, Math.exp(-overdueDays * dailyDecay));
    }

    function noteMasteryScore(mode, noteName) {
      const stat = noteStatFor(mode, noteName);
      if (!stat || !stat.attempts) {
        return 0;
      }
      const accuracyScore = Math.min(1, noteAccuracy(stat) / 0.92);
      const speedMs = noteAverageResponseMs(stat);
      const speedScore = speedMs === null ? 0 : Math.max(0, Math.min(1, (3200 - speedMs) / 1700));
      const streakScore = Math.max(0, Math.min(1, Number(stat.streak || 0) / 4));
      const repetitionScore = Math.max(0, Math.min(1, Number(stat.attempts || 0) / 6));
      const baseScore =
        (accuracyScore * 0.42) +
        (speedScore * 0.23) +
        (streakScore * 0.2) +
        (repetitionScore * 0.15);
      return baseScore * noteRetentionFactor(stat);
    }

    function noteIsSecure(mode, noteName) {
      const stat = noteStatFor(mode, noteName);
      if (!stat || Number(stat.attempts || 0) < 4) {
        return false;
      }
      return noteMasteryScore(mode, noteName) >= 0.82;
    }

    function rangeReadyForExpansion(mode, range) {
      const rangeNotes = notesInRange(mode, range);
      return rangeNotes.length > 0 && rangeNotes.every((noteName) => noteIsSecure(mode, noteName));
    }

    function srsProgressScore(state) {
      if (!state) {
        return -1;
      }
      const level = Math.max(1, Number(state.level) || 1);
      const attempts = Array.isArray(state.attempts) ? state.attempts.length : 0;
      const newNotes = Array.isArray(state.newNotes) ? state.newNotes.length : 0;
      return ((level - 1) * 1000) + attempts + (newNotes * 10);
    }

    function rememberPromptedNote(mode, noteName) {
      recentPromptHistory.unshift(`${mode}:${noteName}`);
      if (recentPromptHistory.length > 10) {
        recentPromptHistory.length = 10;
      }
    }

    function isRecentlyPrompted(mode, noteName) {
      return recentPromptHistory.includes(`${mode}:${noteName}`);
    }

    function noteSelectionWeight(mode, noteName, isNew = false) {
      const stat = noteStatFor(mode, noteName);
      if (!stat || Number(stat.attempts || 0) === 0) {
        return isNew ? 12 : 8;
      }
      const accuracy = noteAccuracy(stat);
      const masteryGap = 1 - noteMasteryScore(mode, noteName);
      const attempts = Number(stat.attempts || 0);
      const confusionTotal = Object.values(stat.confusions || {}).reduce((sum, value) => sum + Number(value || 0), 0);
      const retentionPenalty = 1 + Math.max(0, 1 - noteRetentionFactor(stat)) * 4;
      const freshnessBoost = Math.max(0.8, 1.8 - Math.min(attempts, 20) / 20);
      const confusionBoost = 1 + Math.min(2, confusionTotal / 3);
      const accuracyPenalty = 1 + Math.max(0, 0.9 - accuracy) * 5;
      const newNoteBoost = isNew ? 1.6 : 1;
      const recentPenalty = isRecentlyPrompted(mode, noteName) ? 0.2 : 1;
      return Math.max(0.25, (1 + masteryGap * 5) * freshnessBoost * confusionBoost * accuracyPenalty * retentionPenalty * newNoteBoost * recentPenalty);
    }

    function pickWeightedNote(entries, mode, state) {
      const weights = entries.map((entry) =>
        noteSelectionWeight(mode, entry.name, Boolean(state?.newNotes?.includes(entry.name)))
      );
      const total = weights.reduce((sum, weight) => sum + weight, 0);
      let threshold = Math.random() * (total || 1);
      for (let index = 0; index < entries.length; index += 1) {
        threshold -= weights[index];
        if (threshold <= 0) {
          return entries[index];
        }
      }
      return entries[entries.length - 1];
    }

    function resolvePracticeModeForRound() {
      if (currentState === 0) {
        return "treble";
      }
      if (currentState === 1) {
        return "bass";
      }
      const trebleScore = srsProgressScore(srsStates.treble);
      const bassScore = srsProgressScore(srsStates.bass);
      if (trebleScore === bassScore) {
        dailyModeFlip = !dailyModeFlip;
        return dailyModeFlip ? "treble" : "bass";
      }
      return trebleScore <= bassScore ? "treble" : "bass";
    }

    function applySrsRange(mode) {
      const state = srsStates[mode] || createInitialSrsState(mode);
      return srsTrainingRangeFromState(mode, state);
    }

    function pickNextNote() {
      const mode = resolvePracticeModeForRound();
      currentPracticeMode = mode;
      const state = srsStates[mode] = srsStates[mode] || createInitialSrsState(mode);
      const range = applySrsRange(mode);
      const allowedNotes = new Set(notesInRange(mode, range));
      const entries = srsRangeOptionsForMode(mode).filter((entry) => allowedNotes.has(entry.name));
      const picked = pickWeightedNote(entries, mode, state);
      rememberPromptedNote(mode, picked.name);
      return {
        ...picked,
        mode,
        state: "idle",
        isNew: Boolean(state.newNotes?.includes(picked.name))
      };
    }

    function noteOffset(step) {
      return `${step * -1}em`;
    }

    function stemDirection(step) {
      return step >= 0 ? "note-down" : "note-up";
    }

    function ledgerSteps(step) {
      if (step <= -6) {
        const steps = [];
        const lowestLedgerStep = step % 2 === 0 ? step : step + 1;
        for (let ledgerStep = -6; ledgerStep >= lowestLedgerStep; ledgerStep -= 2) {
          steps.push(ledgerStep);
        }
        return steps;
      }
      if (step >= 6) {
        const steps = [];
        const highestLedgerStep = step % 2 === 0 ? step : step - 1;
        for (let ledgerStep = 6; ledgerStep <= highestLedgerStep; ledgerStep += 2) {
          steps.push(ledgerStep);
        }
        return steps;
      }
      return [];
    }

    function createNoteSlot(note) {
      const slot = document.createElement("div");
      slot.className = "note-slot";

      for (const step of ledgerSteps(note.step)) {
        const ledgerLine = document.createElement("div");
        ledgerLine.className = "ledger-line";
        ledgerLine.style.setProperty("--offset", noteOffset(step));
        if (note.state === "correct") {
          ledgerLine.classList.add("is-correct");
        }
        if (note.state === "wrong") {
          ledgerLine.classList.add("is-wrong");
        }
        slot.appendChild(ledgerLine);
      }

      const noteElement = document.createElement("div");
      noteElement.className = `note ${stemDirection(note.step)}`;
      noteElement.style.setProperty("--offset", noteOffset(note.step));
      noteElement.setAttribute("role", "img");
      noteElement.setAttribute("aria-label", note.name);
      if (note.state === "correct") {
        noteElement.classList.add("is-correct");
      }
      if (note.state === "wrong") {
        noteElement.classList.add("is-wrong");
      }
      slot.appendChild(noteElement);

      if (String(note.name).includes("#")) {
        const accidentalElement = document.createElement("div");
        accidentalElement.className = "note-accidental";
        accidentalElement.style.setProperty("--offset", noteOffset(note.step));
        accidentalElement.textContent = "#";
        accidentalElement.setAttribute("aria-hidden", "true");
        slot.appendChild(accidentalElement);
      }

      if (revealNoteNames) {
        const badgeElement = document.createElement("div");
        badgeElement.className = "note-name-badge";
        badgeElement.style.setProperty("--offset", noteOffset(note.step));
        badgeElement.textContent = displayNoteName(note.name).replace(/\d/g, "");
        badgeElement.setAttribute("aria-hidden", "true");
        slot.appendChild(badgeElement);
      }

      return slot;
    }

    function renderNotes() {
      const fragment = document.createDocumentFragment();
      if (currentNote) {
        fragment.appendChild(createNoteSlot(currentNote));
      }
      notesContainer.replaceChildren(fragment);
    }

    function updateRevealToggleUi() {
      panelRevealToggle.classList.toggle("is-active", revealNoteNames);
      panelRevealToggle.setAttribute("aria-pressed", revealNoteNames ? "true" : "false");
    }

    function updateClefUi() {
      const nextClef = currentNote?.clef || (currentPracticeMode === "bass" ? "bass" : "treble");
      clefSymbol.innerHTML = clefSvgMarkup[nextClef] || "";
    }

    function renderPracticeUi() {
      updateClefUi();
      renderNotes();
    }

    function localProgressKey() {
      return authUser?.id ? `${LOCAL_PROGRESS_PREFIX}:${authUser.id}` : "";
    }

    function serializeProgress() {
      return {
        currentState,
        revealNoteNames,
        srsStates,
        noteStats
      };
    }

    function saveProgress() {
      if (!authUser) {
        return;
      }
      const key = localProgressKey();
      if (!key) {
        return;
      }
      try {
        localStorage.setItem(key, JSON.stringify(serializeProgress()));
      } catch (error) {
        console.warn("[Progress] Speichern fehlgeschlagen", error);
      }
    }

    function applyProgressRecord(record) {
      if (!record || typeof record !== "object") {
        return;
      }
      currentState = Number.isInteger(record.currentState) ? Math.max(0, Math.min(titles.length - 1, record.currentState)) : currentState;
      revealNoteNames = Boolean(record.revealNoteNames);
      srsStates = {
        treble: record.srsStates?.treble || createInitialSrsState("treble"),
        bass: record.srsStates?.bass || createInitialSrsState("bass")
      };
      noteStats = {
        treble: record.noteStats?.treble || {},
        bass: record.noteStats?.bass || {}
      };
      noteStats.treble = noteStats.treble || {};
      noteStats.bass = noteStats.bass || {};
    }

    function loadProgress() {
      if (!authUser) {
        return;
      }
      const key = localProgressKey();
      if (!key) {
        return;
      }
      try {
        const raw = localStorage.getItem(key);
        if (!raw) {
          srsStates = {
            treble: createInitialSrsState("treble"),
            bass: createInitialSrsState("bass")
          };
          noteStats = { treble: {}, bass: {} };
          revealNoteNames = false;
          currentState = 0;
          return;
        }
        applyProgressRecord(JSON.parse(raw));
      } catch (error) {
        console.warn("[Progress] Laden fehlgeschlagen", error);
      }
    }

    function clearPendingReset() {
      if (currentResetTimeout) {
        window.clearTimeout(currentResetTimeout);
        currentResetTimeout = null;
      }
    }

    function recordResponseMs() {
      if (!promptStartedAt) {
        return null;
      }
      return Math.max(0, Date.now() - promptStartedAt);
    }

    function recordNoteStat(mode, noteName, isCorrect, { responseMs = null, playedNoteName = "" } = {}) {
      if (!mode || !noteName) {
        return;
      }
      noteStats[mode] = noteStats[mode] || {};
      const stats = noteStats[mode][noteName] || {
        attempts: 0,
        correct: 0,
        streak: 0,
        total_ms: 0,
        fastest_ms: null,
        slowest_ms: null,
        confusions: {},
        last_seen_at: null,
        last_correct_at: null
      };
      stats.attempts += 1;
      stats.last_seen_at = new Date().toISOString();
      if (isCorrect) {
        stats.correct += 1;
        stats.streak = Number(stats.streak || 0) + 1;
        stats.last_correct_at = stats.last_seen_at;
      } else {
        stats.streak = 0;
        if (playedNoteName && playedNoteName !== noteName) {
          stats.confusions = stats.confusions || {};
          stats.confusions[playedNoteName] = Number(stats.confusions[playedNoteName] || 0) + 1;
        }
      }
      if (responseMs !== null && Number.isFinite(responseMs)) {
        stats.total_ms = Number(stats.total_ms || 0) + responseMs;
        stats.fastest_ms = stats.fastest_ms === null ? responseMs : Math.min(Number(stats.fastest_ms || responseMs), responseMs);
        stats.slowest_ms = stats.slowest_ms === null ? responseMs : Math.max(Number(stats.slowest_ms || responseMs), responseMs);
      }
      noteStats[mode][noteName] = stats;
      saveProgress();
    }

    function maybeAdjustSrsRange(mode) {
      const state = srsStates[mode];
      if (!state || state.attempts.length < srsConfig.sampleSize) {
        return false;
      }

      const accuracy = state.attempts.filter(Boolean).length / state.attempts.length;
      const ranges = levelRangesByMode[mode] || [];
      const canGrow = state.level < ranges.length;
      const canShrink = state.level > 1;
      const currentRange = srsTrainingRangeFromState(mode, state);
      const readyForExpansion = rangeReadyForExpansion(mode, currentRange);

      if (accuracy >= srsConfig.growThreshold && canGrow && readyForExpansion) {
        const previousRange = currentRange;
        state.level += 1;
        state.attempts = [];
        const nextRange = srsTrainingRangeFromState(mode, state);
        const previousNotes = new Set(notesInRange(mode, previousRange));
        state.newNotes = notesInRange(mode, nextRange).filter((noteName) => !previousNotes.has(noteName));
        saveProgress();
        return true;
      }

      if (accuracy < srsConfig.shrinkThreshold && canShrink) {
        state.level -= 1;
        state.attempts = [];
        state.newNotes = [];
        saveProgress();
        return true;
      }

      return false;
    }

    function recordSrsAttempt(mode, isCorrect) {
      const state = srsStates[mode] = srsStates[mode] || createInitialSrsState(mode);
      state.attempts.push(isCorrect);
      if (state.attempts.length > srsConfig.sampleSize) {
        state.attempts.shift();
      }
      const changedRange = maybeAdjustSrsRange(mode);
      saveProgress();
      return changedRange;
    }

    function generateRound() {
      if (!isAuthenticated || isAdminMode) {
        return;
      }
      clearPendingReset();
      currentNote = pickNextNote();
      promptStartedAt = Date.now();
      renderPracticeUi();
    }

    function setFeedback(message, state = "waiting") {
      void message;
      void state;
    }

    function updateMidiUi(isConnected, message = "") {
      midiConnected = isConnected;
      setFeedback(message || (isConnected ? "MIDI aktiv" : "Warte auf MIDI"), isConnected ? "success" : "waiting");
    }

    function midiPortsToArray(portCollection) {
      if (!portCollection) {
        return [];
      }
      if (Array.isArray(portCollection)) {
        return portCollection;
      }
      if (typeof portCollection.values === "function") {
        try {
          return Array.from(portCollection.values());
        } catch (error) {
          void error;
        }
      }
      if (typeof portCollection.length === "number") {
        return Array.from(portCollection);
      }
      return [];
    }

    function listMidiInputs(midiAccess) {
      if (!midiAccess) {
        return [];
      }
      return typeof midiAccess.inputs === "function"
        ? midiPortsToArray(midiAccess.inputs())
        : midiPortsToArray(midiAccess.inputs);
    }

    function hasConnectedMidiInput(midiAccess) {
      return listMidiInputs(midiAccess).some((input) => input.state === "connected");
    }

    function handlePlayedMidi(midiNote) {
      if (!isAuthenticated || !currentNote) {
        return;
      }

      clearPendingReset();
      const responseMs = recordResponseMs();

      if (midiNote === currentNote.midi) {
        currentNote.state = "correct";
        renderPracticeUi();
        recordNoteStat(currentNote.mode, currentNote.name, true, { responseMs });
        const rangeChanged = recordSrsAttempt(currentNote.mode, true);
        const modeState = srsStates[currentNote.mode];
        modeState.newNotes = (modeState.newNotes || []).filter((noteName) => noteName !== currentNote.name);
        saveProgress();
        currentResetTimeout = window.setTimeout(() => {
          if (rangeChanged) {
            generateRound();
            return;
          }
          generateRound();
        }, 550);
        return;
      }

      currentNote.state = "wrong";
      renderPracticeUi();
      const playedNoteName = midiNumberToName(midiNote);
      recordNoteStat(currentNote.mode, currentNote.name, false, {
        responseMs,
        playedNoteName
      });
      const rangeChanged = recordSrsAttempt(currentNote.mode, false);
      currentResetTimeout = window.setTimeout(() => {
        if (rangeChanged) {
          generateRound();
          return;
        }
        if (currentNote) {
          currentNote.state = "idle";
          promptStartedAt = Date.now();
          renderPracticeUi();
        }
      }, 700);
    }

    function onMidiMessage(event) {
      const [status, noteNumber, velocity] = event.data;
      const messageType = status & 0xf0;
      if (messageType === 0x90 && velocity > 0) {
        handlePlayedMidi(noteNumber);
      }
    }

    function bindMidiInputs(midiAccess) {
      for (const input of listMidiInputs(midiAccess)) {
        input.onmidimessage = input.state === "connected" ? onMidiMessage : null;
      }
      const connected = hasConnectedMidiInput(midiAccess);
      updateMidiUi(connected, connected ? "MIDI aktiv" : "Kein MIDI-Keyboard gefunden");
    }

    async function initMidi() {
      if (isMidiConnecting) {
        return;
      }
      if (!("requestMIDIAccess" in navigator)) {
        updateMidiUi(false, "Web MIDI API ist in diesem Browser nicht verfuegbar");
        return;
      }
      isMidiConnecting = true;
      updateMidiUi(false, "MIDI wird verbunden...");
      try {
        midiAccessRef = await navigator.requestMIDIAccess();
        bindMidiInputs(midiAccessRef);
        midiAccessRef.onstatechange = () => bindMidiInputs(midiAccessRef);
        updateMidiUi(hasConnectedMidiInput(midiAccessRef), hasConnectedMidiInput(midiAccessRef) ? "MIDI aktiv" : "Kein MIDI-Keyboard gefunden");
      } catch (error) {
        updateMidiUi(false, error?.message || "MIDI-Freigabe fehlgeschlagen");
      } finally {
        isMidiConnecting = false;
      }
    }

    async function ensureSupabaseClient() {
      if (supabaseClient || !isSupabaseConfigured()) {
        return supabaseClient;
      }
      const module = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      supabaseClient = module.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false,
          storageKey: "learnnotes-supabase-auth"
        }
      });
      return supabaseClient;
    }

    async function handleSignedInUser(user, session = null) {
      authUser = user;
      isAuthenticated = true;
      if (session) {
        setAuthCookie(session);
      } else {
        clearAuthCookie();
      }
      timerStartedAt = Date.now();
      loadProgress();
      updateRevealToggleUi();
      document.body.dataset.state = String(currentState);
      titleElement.textContent = titles[currentState];
      renderAuthUi();
      generateRound();
    }

    function handleSignedOut() {
      authUser = null;
      isAuthenticated = false;
      clearAuthCookie();
      currentNote = null;
      resetAuthFlow(true);
      setAuthStatus(isSupabaseConfigured() ? "" : "Supabase URL und Anon Key fehlen noch.", isSupabaseConfigured() ? "" : "error");
      renderAuthUi();
      focusAuthInput();
    }

    async function handleAuthPrimary() {
      if (authBusy) {
        return;
      }

      if (authStep === "email") {
        const email = authFlowInput.value.trim().toLowerCase();
        if (!email || !email.includes("@")) {
          setAuthStatus("Bitte eine gueltige E-Mailadresse eingeben.", "error");
          return;
        }
        authEmailDraft = email;
        authStep = "password";
        authFlowInput.value = "";
        setAuthStatus("", "");
        renderAuthUi();
        focusAuthInput();
        return;
      }

      if (!isSupabaseConfigured()) {
        setAuthStatus("Supabase URL und Anon Key fehlen noch.", "error");
        return;
      }

      const password = authFlowInput.value;
      if (!password) {
        setAuthStatus("Bitte dein Passwort eingeben.", "error");
        return;
      }

      authBusy = true;
      renderAuthUi();
      setAuthStatus("Anmeldung wird geprueft...", "success");

      try {
        const client = await ensureSupabaseClient();
        const { data, error } = await client.auth.signInWithPassword({
          email: authEmailDraft,
          password
        });
        if (error) {
          setAuthStatus(error.message || "Login fehlgeschlagen.", "error");
          return;
        }
        authFlowInput.value = "";
        setAuthStatus("", "");
        await handleSignedInUser(data.user || data.session?.user, data.session || null);
      } catch (error) {
        console.error("[Auth] Anmeldung fehlgeschlagen", error);
        setAuthStatus(error?.message || "Login fehlgeschlagen.", "error");
      } finally {
        authBusy = false;
        renderAuthUi();
      }
    }

    async function initAuth() {
      if (!isSupabaseConfigured()) {
        renderAuthUi();
        setAuthStatus("Supabase URL und Anon Key fehlen noch.", "error");
        return;
      }

      try {
        const client = await ensureSupabaseClient();
        authSubscription = client.auth.onAuthStateChange((event, session) => {
          if (session?.user) {
            void handleSignedInUser(session.user, session);
            return;
          }
          if (event === "SIGNED_OUT") {
            handleSignedOut();
          }
        });
        const { data, error } = await client.auth.getSession();
        if (error) {
          setAuthStatus(error.message || "Session konnte nicht geladen werden.", "error");
          return;
        }
        if (data.session?.user) {
          await handleSignedInUser(data.session.user, data.session);
          return;
        }
        const localSession = getAuthCookie();
        if (localSession?.access_token && localSession?.refresh_token) {
          const { data: restored, error: restoreError } = await client.auth.setSession({
            access_token: localSession.access_token,
            refresh_token: localSession.refresh_token
          });
          if (restoreError) {
            clearAuthCookie();
          } else if (restored.session?.user) {
            await handleSignedInUser(restored.session.user, restored.session);
            return;
          }
        } else if (localSession?.user?.email) {
          await handleSignedInUser({
            id: localSession.user.id || localSession.user.email,
            email: localSession.user.email
          });
          return;
        }
      } catch (error) {
        console.error("[Auth] Initialisierung fehlgeschlagen", error);
        setAuthStatus(error?.message || "Supabase konnte nicht geladen werden.", "error");
      }

      handleSignedOut();
    }

    function syncPracticeMode(force = false) {
      if (!isAuthenticated || isAdminMode) {
        return;
      }
      if (force || !currentNote) {
        generateRound();
        return;
      }
      renderPracticeUi();
    }

    function setTitle(nextState, direction) {
      if (!isAuthenticated || animating || isAdminMode || nextState === currentState) {
        return;
      }
      animating = true;
      titleElement.classList.add("is-exiting");
      titleElement.style.transform = `translateX(${direction > 0 ? 18 : -18}px)`;
      window.setTimeout(() => {
        currentState = nextState;
        document.body.dataset.state = String(currentState);
        titleElement.textContent = titles[currentState];
        saveProgress();
        syncPracticeMode(true);
        titleElement.classList.remove("is-exiting");
        titleElement.classList.add("is-entering");
        titleElement.style.transform = `translateX(${direction > 0 ? -18 : 18}px)`;
        requestAnimationFrame(() => {
          titleElement.classList.remove("is-entering");
          titleElement.style.transform = "";
          animating = false;
        });
      }, 180);
    }

    function enterAdminMode() {
      if (!isAuthenticated || isAdminMode) {
        return;
      }
      isAdminMode = true;
      document.body.classList.add("is-admin");
      titleElement.classList.remove("is-exiting", "is-entering");
      titleElement.style.transform = "";
      titleElement.textContent = "Verwaltung";
      leftStackElement.classList.remove("is-expanded");
      cornerButton.classList.remove("is-active");
      cornerButton.setAttribute("aria-pressed", "false");
      panelElement.classList.remove("is-fluid-active");
      closeCalendarDetail();
      closeAdminTools();
      adminHintElement.classList.add("is-returning");
      adminHintIconElement.setAttribute("data-lucide", "drum");
      adminHintTextElement.textContent = "Hier gehts zurück zum spielen";
      lucide.createIcons();
    }

    function exitAdminMode() {
      if (!isAdminMode) {
        return;
      }
      isAdminMode = false;
      document.body.classList.remove("is-admin");
      titleElement.textContent = titles[currentState];
      closeCalendarDetail();
      closeAdminTools();
      adminHintElement.classList.remove("is-returning");
      adminHintIconElement.setAttribute("data-lucide", "wrench");
      adminHintTextElement.textContent = "Hier entlang zur Verwaltung.";
      lucide.createIcons();
      syncPracticeMode();
    }

    function commitSwipe(deltaX, deltaY) {
      if (!isAuthenticated) {
        return;
      }
      const threshold = 60;
      if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > threshold) {
        if (deltaY > 0) {
          enterAdminMode();
        } else {
          exitAdminMode();
        }
        return;
      }
      if (!isAdminMode && Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > threshold) {
        const nextState = deltaX < 0
          ? (currentState + 1) % titles.length
          : (currentState - 1 + titles.length) % titles.length;
        setTitle(nextState, deltaX);
      }
    }

    screenElement.addEventListener("pointerdown", (event) => {
      if (!isAuthenticated || touchIdentifier !== null || shouldIgnoreSwipeTarget(event.target)) {
        return;
      }
      pointerId = event.pointerId;
      startX = event.clientX;
      startY = event.clientY;
      screenElement.setPointerCapture?.(event.pointerId);
    });

    screenElement.addEventListener("pointerup", (event) => {
      if (pointerId !== event.pointerId || startX === null || startY === null) {
        return;
      }
      commitSwipe(event.clientX - startX, event.clientY - startY);
      resetSwipeState();
    });

    screenElement.addEventListener("pointercancel", () => {
      resetSwipeState();
    });

    screenElement.addEventListener("touchstart", (event) => {
      if (!isAuthenticated || pointerId !== null || touchIdentifier !== null || shouldIgnoreSwipeTarget(event.target)) {
        return;
      }
      const touch = event.changedTouches[0];
      if (!touch) {
        return;
      }
      touchIdentifier = touch.identifier;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    screenElement.addEventListener("touchmove", (event) => {
      if (touchIdentifier === null) {
        return;
      }
      const touch = Array.from(event.changedTouches).find((item) => item.identifier === touchIdentifier);
      if (!touch) {
        return;
      }
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;
      if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
        event.preventDefault();
      }
    }, { passive: false });

    screenElement.addEventListener("touchend", (event) => {
      if (touchIdentifier === null) {
        return;
      }
      const touch = Array.from(event.changedTouches).find((item) => item.identifier === touchIdentifier);
      if (!touch) {
        return;
      }
      commitSwipe(touch.clientX - touchStartX, touch.clientY - touchStartY);
      resetSwipeState();
    }, { passive: true });

    screenElement.addEventListener("touchcancel", () => {
      resetSwipeState();
    });

    adminCalendarGrid.addEventListener("click", (event) => {
      if (!isAuthenticated || !isAdminMode) {
        return;
      }
      const cell = event.target.closest(".admin-calendar-cell");
      if (!cell || cell.classList.contains("is-empty")) {
        return;
      }
      const year = Number(cell.dataset.year);
      const month = Number(cell.dataset.month);
      const day = Number(cell.dataset.day);
      const rowIndex = Number(cell.dataset.row);
      const totalRows = Number(adminCalendarGrid.dataset.rows);
      const date = new Date(year, month, day);
      const isAbove = rowIndex >= Math.ceil(totalRows / 2);
      const dateKey = formatCalendarDateKey(date);

      if (selectedCalendarCell && selectedCalendarCell !== cell) {
        selectedCalendarCell.classList.remove("is-selected");
      }
      selectedCalendarCell = cell;
      selectedCalendarDateKey = dateKey;
      cell.classList.add("is-selected");
      adminCalendarDetailDate.textContent = formatCalendarDateLabel(date);
      adminCalendarDetail.classList.add("is-open");
      adminCalendarDetail.classList.toggle("is-above", isAbove);
      adminCalendarDetail.classList.toggle("is-below", !isAbove);
      adminCalendarDetail.setAttribute("aria-hidden", "false");
      adminCalendarStage.classList.toggle("is-detail-above", isAbove);
      adminCalendarStage.classList.toggle("is-detail-below", !isAbove);

      const existingEvent = (adminCalendarEvents.get(dateKey) ?? [])[0];
      adminCalendarInputTitle.value = existingEvent?.title ?? "";
      adminCalendarInputTime.value = existingEvent?.time ?? "";
      adminCalendarInputNote.value = existingEvent?.note ?? "";
      requestAnimationFrame(() => {
        adminCalendarInputTitle.focus({ preventScroll: true });
      });
    });

    adminCalendarDetailClose.addEventListener("click", () => {
      closeCalendarDetail();
    });

    adminCalendarForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!selectedCalendarDateKey || !selectedCalendarCell) {
        return;
      }
      const title = adminCalendarInputTitle.value.trim() || "Termin";
      const time = adminCalendarInputTime.value.trim();
      const note = adminCalendarInputNote.value.trim();
      const events = adminCalendarEvents.get(selectedCalendarDateKey) ?? [];
      events.unshift({ title, time, note });
      adminCalendarEvents.set(selectedCalendarDateKey, events.slice(0, 2));
      renderCalendarEvents(selectedCalendarCell, selectedCalendarDateKey);
      adminCalendarInputTitle.value = "";
      adminCalendarInputTime.value = "";
      adminCalendarInputNote.value = "";
      closeCalendarDetail();
    });

    adminToolsButton.addEventListener("click", () => {
      if (!isAuthenticated) {
        return;
      }
      const nextExpanded = !adminTools.classList.contains("is-expanded");
      adminTools.classList.toggle("is-expanded", nextExpanded);
      adminToolsButton.classList.toggle("is-active", nextExpanded);
      adminToolsButton.setAttribute("aria-pressed", nextExpanded ? "true" : "false");
    });

    cornerButton.addEventListener("click", () => {
      if (!isAuthenticated) {
        return;
      }
      if (isAdminMode) {
        exitAdminMode();
        return;
      }
      const nextExpanded = !leftStackElement.classList.contains("is-expanded");
      leftStackElement.classList.toggle("is-expanded", nextExpanded);
      cornerButton.classList.toggle("is-active", nextExpanded);
      cornerButton.setAttribute("aria-pressed", nextExpanded ? "true" : "false");
    });

    panelMidiTrigger.addEventListener("click", () => {
      if (isAuthenticated) {
        initMidi();
      }
    });

    panelRevealToggle.addEventListener("click", () => {
      if (!isAuthenticated) {
        return;
      }
      revealNoteNames = !revealNoteNames;
      updateRevealToggleUi();
      renderPracticeUi();
      saveProgress();
    });

    authFlowInput.addEventListener("input", () => {
      if (authStatus.dataset.state === "error") {
        setAuthStatus("", "");
      }
    });

    authFlowInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        void handleAuthPrimary();
        return;
      }
      if (event.key === "Escape" && authStep === "password") {
        resetAuthFlow(false);
        setAuthStatus("", "");
        renderAuthUi();
        focusAuthInput();
      }
    });

    authStepButton.addEventListener("click", () => {
      void handleAuthPrimary();
    });

async function boot() {
  document.body.dataset.state = "0";
  updateTimer();
  buildAdminCalendar();
  updateRevealToggleUi();
  renderAuthUi();
  updateAdminAccessUi();
  focusAuthInput();
  window.setInterval(updateTimer, 1000);
  lucide.createIcons();

  void initMidi();
  await initAuth();
}

// Ganz am Ende steht bei dir:
boot();
  </script>
